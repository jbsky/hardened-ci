# =====================================================================
#  prep -- construire le stage `prep` UNE SEULE fois, et le servir a la fois
#  aux scans (image locale <image>-prep:scan) et au build de l'image finale
#  (contexte nomme `prep=oci-layout://...`).
#
#  Avant (jusqu'a v1.4.11) prep etait resolu deux fois par publication : par
#  le build de l'image, puis par un build `target: prep` dedie aux scans et a
#  la SBOM. Rien ne garantissait que les deux soient le meme : le 2026-11-18,
#  uptime-kuma-hardened:2.5.12.0 a ete publiee avec la couche
#  `COPY --link --from=prep` du 2026-11-16 a l'octet (node v24.22.1) alors que
#  prep venait d'installer nodejs 24.22.3 -- et c'est 24.22.3 que la SBOM
#  attestee, le scan et cve-watch ont vu. Avec ce contexte, le `FROM ... AS
#  prep` du Dockerfile est remplace par l'image scannee elle-meme : ce qui
#  est copie dans l'image finale est ce qui a ete scanne. La porte
#  scripts/check-prep-fidelity.sh le verifie ensuite sur le contenu.
# =====================================================================
name: prep
description: Stage prep construit une fois -- image locale pour les scans + contexte nomme pour le build final
inputs:
  context:
    description: Contexte du build (matrix.image.path)
    required: true
  file:
    description: Dockerfile (matrix.image.file)
    required: true
  build-args:
    description: Sortie build-args de l'action versions
    required: true
  platform:
    description: Plateforme unique (linux/amd64, linux/arm64)
    required: true
  image-name:
    description: Nom de l'image ; l'image locale sera <image-name>-prep:scan
    required: true
  cache-scope:
    description: Scope du cache gha (lu et ecrit ici ; le build final n'en utilise plus)
    required: true
outputs:
  context:
    description: "Ligne prep=oci-layout://<dir>@<digest> pour build-contexts"
    value: ${{ steps.ctx.outputs.context }}
  image:
    description: Image locale de prep, pour les scans et la porte de fidelite
    value: ${{ steps.ctx.outputs.image }}
runs:
  using: composite
  steps:
    - name: Build prep stage (une seule fois, OCI)
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build-args }}
        target: prep
        platforms: ${{ inputs.platform }}
        tags: ${{ inputs.image-name }}-prep:scan
        # L'exporteur docker : son archive porte manifest.json (docker load) ET
        # la disposition OCI (index.json) que lit le contexte oci-layout ; une
        # archive type=oci, docker load la refuse ("does not contain a manifest.json").
        outputs: type=docker,dest=${{ runner.temp }}/prep.tar
        # Le stage prep porte les paquets qui finissent dans l'image : jamais
        # du cache, sinon manifeste et scan CVE examinent des paquets perimes.
        no-cache-filters: prep
        # Le seul cache du build : les stages lourds dont prep depend
        # (compilation, npm). Le build de l'image finale n'en lit aucun.
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
    - name: Contexte nomme + image locale
      id: ctx
      shell: bash
      env:
        IMAGE: ${{ inputs.image-name }}-prep:scan
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/prep-oci"
        rm -rf "$dir" && mkdir -p "$dir"
        tar -xf "${RUNNER_TEMP}/prep.tar" -C "$dir"
        digest=$(jq -r '.manifests[0].digest' "$dir/index.json")
        ref=$(jq -r '.manifests[0].annotations."org.opencontainers.image.ref.name" // empty' "$dir/index.json")
        [[ "$digest" == sha256:* && -n "$ref" ]] || { echo "::error::index OCI de prep sans digest ou sans nom"; exit 1; }
        docker load -i "${RUNNER_TEMP}/prep.tar"
        docker image inspect "$IMAGE" > /dev/null
        echo "prep : ${digest} (${IMAGE})"
        # oci-layout exige <dir>:<tag>@<digest> : sans le tag, buildx lit
        # le chemin comme un nom vide ("invalid reference format").
        echo "context=prep=oci-layout://${dir}:${ref}@${digest}" >> "$GITHUB_OUTPUT"
        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
