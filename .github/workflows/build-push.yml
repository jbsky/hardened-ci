# =====================================================================
#  build-push -- gabarit commun du pipeline des images durcies (etape 4).
#
#  Le depot appelant garde ses declencheurs (on: et paths:) et decrit ce qui
#  le distingue dans UN fichier, .github/hardened-ci.json (scripts/hci-config.py) :
#  nom d'image, lecture de la version, entrees du compteur de revision,
#  plateformes, service compose, sondes de version, tests fonctionnels.
#
#  Chaine : lint -> build amd64 (prep scanne, SBOM) -> test sur le digest
#  EXACT qui sera publie -> build arm64 (runner natif) -> garde de revision
#  (un tag <version>.<revision> publie n'est jamais repromu) -> promote (tags
#  sur le digest teste, cosign, SBOM atteste, SLSA) -> README -> purge des
#  vieux tags -> release (tags v*) -> issue si echec.
#
#  Les actions et scripts de hardened-ci viennent d'un checkout de ce depot a
#  job.workflow_sha : le SHA exact de CE workflow (github.sha est celui de
#  l'appelant). Aucune ref a passer, aucune copie.
#
#  Signature : le certificat cosign porte l'identite de CE workflow
#  (jbsky/hardened-ci/.github/workflows/build-push.yml@...) et, en extension,
#  le depot appelant. Les verificateurs exigent les deux : identite (appelant
#  OU hardened-ci) ET --certificate-github-workflow-repository = l'appelant.
#
#  Appel (le job appelant accorde les permissions, passe les secrets) :
#
#    jobs:
#      pipeline:
#        uses: jbsky/hardened-ci/.github/workflows/build-push.yml@<sha> # vX.Y.Z
#        permissions: {contents: write, packages: write, id-token: write,
#                      attestations: write, security-events: write, issues: write}
#        secrets:
#          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
#          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
# =====================================================================
name: build-push

on:
  workflow_call:
    inputs:
      workdir:
        description: Repertoire du depot d'image dans le checkout (tests de hardened-ci seulement)
        type: string
        default: .
      publish:
        description: "'false' force le mode PR (build + test, rien de pousse) meme hors pull_request"
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  #  Lecture unique du fichier de description du depot.
  # -------------------------------------------------------------------
  config:
    name: Config
    runs-on: ubuntu-latest
    outputs:
      # Les images du depot, normalisees et prefixees de `workdir` : c'est la
      # matrice de build, de promotion et des tests. Un depot mono-image en a
      # une -- rien ne change pour lui.
      images: ${{ steps.c.outputs.images }}
      multi: ${{ steps.c.outputs.multi }}
      # L'image PREMIERE : ce que les jobs d'echelle depot (release) nomment.
      image: ${{ steps.c.outputs.image }}
      arm64: ${{ steps.c.outputs.arm64 }}
      validate: ${{ steps.c.outputs.validate }}
      version: ${{ steps.c.outputs.version }}
      publish: ${{ steps.c.outputs.publish }}
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      - name: Lire .github/hardened-ci.json
        id: c
        env:
          HCI: ${{ github.workspace }}/.hardened-ci/scripts/hci-config.py
          PUBLISH_INPUT: ${{ inputs.publish }}
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          "$HCI" --check
          # jq assemble les chemins une fois pour toutes : les jobs n'ont plus
          # qu'a lire matrix.image.path / .file / .gomod / .manifestfile.
          IMAGES=$("$HCI" matrix | jq -c --arg wd "$WD" '
            def j($a; $b): if $a == "." then $b elif $b == "." then $a else $a + "/" + $b end;
            [ .[] | . + {
                path:         j($wd; .context),
                file:         j($wd; .dockerfile),
                manifestfile: j($wd; .manifest),
                gomod:        j(j($wd; .context); "go.mod")
              } ]')
          {
            echo "images=${IMAGES}"
            echo "multi=$(jq 'length > 1' <<<"$IMAGES")"
            echo "image=$("$HCI" get image)"
            echo "arm64=$("$HCI" get platforms | jq -r 'index("linux/arm64") != null')"
            echo "validate=$("$HCI" get validate_on_pr)"
            echo "version=$("$HCI" version)"
            if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$PUBLISH_INPUT" = true ]; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  lint:
    name: Lint
    needs: config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci

      - name: versions.json, seule source des versions du build
        uses: ./.hardened-ci/versions
        with:
          path: ${{ inputs.workdir }}

      # Une copie locale du controle (celle de `make build`) doit valoir celle
      # de hardened-ci a cette ref : sinon les deux derivent en silence.
      - name: Copie locale du controle = hardened-ci
        run: |
          set -euo pipefail
          for f in versions-build-args.py test_versions_build_args.py; do
            [ -f "scripts/$f" ] || continue
            cmp "scripts/$f" "$GITHUB_WORKSPACE/.hardened-ci/scripts/$f" \
              || { echo "::error::scripts/$f differe de jbsky/hardened-ci@${{ job.workflow_sha }}"; exit 1; }
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          find . -path ./.hardened-ci -prune -o -path ./.git -prune -o -name '*.sh' -print0 \
            | xargs -0 -r shellcheck

  # -------------------------------------------------------------------
  #  Ce qui se lit PAR IMAGE : hadolint et le module Go. Un depot a trois
  #  images a trois Dockerfile et trois go.mod (stack-squid) ; un depot
  #  mono-image passe exactement comme avant, avec une matrice d'un element.
  # -------------------------------------------------------------------
  lint-image:
    name: Lint ${{ matrix.image.key }}
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.config.outputs.images) }}
    defaults:
      run:
        working-directory: ${{ matrix.image.path }}
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.image.file }}
          failure-threshold: warning

      - uses: actions/setup-go@v7
        if: hashFiles(matrix.image.gomod) != ''
        with:
          go-version-file: ${{ matrix.image.gomod }}

      - name: gofmt, go vet, go test
        if: hashFiles(matrix.image.gomod) != ''
        run: |
          set -euo pipefail
          fmt_out=$(gofmt -l .)
          [ -z "$fmt_out" ] || { echo "::error::gofmt : fichiers non formates :"; echo "$fmt_out"; exit 1; }
          go vet ./...
          go test ./...

  # -------------------------------------------------------------------
  #  amd64, une seule fois. Hors PR : pousse PAR DIGEST, que `test` retire
  #  et que `promote` etiquette -- l'octet teste est l'octet publie. En PR :
  #  tarball passe a `test`, rien n'est pousse.
  # -------------------------------------------------------------------
  build:
    name: Build ${{ matrix.image.key }}
    needs: [config, lint, lint-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # Une image qui casse ne doit pas masquer l'etat des autres.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.config.outputs.images) }}
    env:
      PUBLISH: ${{ needs.config.outputs.publish }}
      IMAGE_NAME: ${{ matrix.image.image }}
      KEY: ${{ matrix.image.key }}
      COMPOSE: ${{ matrix.image.compose_service }}
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci

      - name: Build-args depuis versions.json
        id: build-args
        uses: ./.hardened-ci/versions
        with:
          path: ${{ inputs.workdir }}

      # `compose config --images <service>` rend AUSSI les images des
      # dependances (squid-explicit depend de c-icap : deux lignes) : filtrer
      # sur le nom de cette image, et echouer si elle n'y est pas -- un tag
      # pris au hasard ferait tester l'image d'a cote.
      - name: Tag local attendu par les tests
        id: local
        run: |
          set -euo pipefail
          if [ -n "$COMPOSE" ]; then
            tag=$(docker compose config --images "$COMPOSE" | grep -E "(^|/)${IMAGE_NAME}(:|@|$)" | head -1)
            [ -n "$tag" ] || { echo "::error::le service ${COMPOSE} ne porte pas ${IMAGE_NAME}"; exit 1; }
          else
            tag="${IMAGE_NAME}:test"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make room for local tarball export (PR only)
        if: env.PUBLISH != 'true'
        run: mkdir -p /tmp/image-tar

      - name: Build (push-by-digest, or local tarball on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.path }}
          file: ${{ matrix.image.file }}
          build-args: ${{ steps.build-args.outputs.build-args }}
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || format('type=docker,dest=/tmp/image-tar/{0}.tar', env.KEY) }}
          tags: ${{ env.PUBLISH != 'true' && steps.local.outputs.tag || '' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-amd64
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-amd64
          # Le stage prep porte les paquets qui finissent dans l'image : jamais
          # du cache, sinon manifeste et scan CVE examinent des paquets perimes.
          no-cache-filters: prep

      # Le seul stage encore lisible par un scanner : les paquets runtime copies
      # dans l'image FROM scratch. SARIF large (CRITICAL+HIGH), echec etroit
      # (CRITICAL corrigeables seulement).
      - name: Build prep stage (Alpine with runtime deps)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.path }}
          file: ${{ matrix.image.file }}
          build-args: ${{ steps.build-args.outputs.build-args }}
          target: prep
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}-prep:scan
          no-cache-filters: prep
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-amd64

      - name: Trivy scan prep stage (report CRITICAL+HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: sarif
          output: trivy-prep.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-prep.sarif
          category: ${{ env.IMAGE_NAME }}-deps

      - name: SBOM of prep stage (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: cyclonedx
          output: sbom-prep.cdx.json

      - name: Upload prep SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-prep-${{ env.KEY }}
          path: sbom-prep.cdx.json
          if-no-files-found: error

      - name: Trivy gate prep stage (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload image tarball (PR only, for the test job)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-tar-${{ env.KEY }}
          path: /tmp/image-tar/${{ env.KEY }}.tar
          if-no-files-found: error
          retention-days: 1

      # Les sorties d'un job en matrice s'ecrasent entre elles : le digest
      # passe donc par un artefact nomme par la cle de l'image. C'est lui que
      # `test` retire et que `promote` etiquette -- l'octet teste est l'octet
      # publie, matrice ou pas.
      - name: Digest de l'image construite
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build n'a pas rendu de digest pour ${KEY}"; exit 1; }
          printf '%s' "$DIGEST" > "${RUNNER_TEMP}/digest-${KEY}.txt"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.KEY }}
          path: ${{ runner.temp }}/digest-${{ env.KEY }}.txt
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  test:
    name: Functional tests
    needs: [config, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PUBLISH: ${{ needs.config.outputs.publish }}
      IMAGES: ${{ needs.config.outputs.images }}
      HCI: ${{ github.workspace }}/.hardened-ci/scripts/hci-config.py
      SCRIPTS: ${{ github.workspace }}/.hardened-ci/scripts
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Digests construits (hors PR)
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Tarballs construits (PR)
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: image-tar-*
          path: /tmp/image-tar
          merge-multiple: true

      # Une image a son tag local : celui que le compose attend, ou
      # <image>:test. L'octet mis sous test est celui que `build` vient de
      # produire -- tire par digest hors PR, charge du tarball en PR.
      - name: Charger les images a eprouver
        env:
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          locals='{}'
          while read -r key image service; do
            if [ -n "$service" ] && [ "$service" != null ]; then
              # Un service qui depend d'un autre fait sortir plusieurs images :
              # ne garder que celle-ci.
              LOCAL=$(docker compose config --images "$service" | grep -E "(^|/)${image}(:|@|$)" | head -1)
              [ -n "$LOCAL" ] || { echo "::error::le service ${service} ne porte pas ${image}"; exit 1; }
            else
              LOCAL="${image}:test"
            fi
            if [ "$PUBLISH" = true ]; then
              REF="${REGISTRY}/${NAMESPACE}/${image}@$(cat "${DIGESTS}/digest-${key}.txt")"
              docker pull -q "$REF"
              docker tag "$REF" "$LOCAL"
            else
              docker load -q -i "/tmp/image-tar/${key}.tar"
              # Le tarball porte deja le tag local (`tags:` du build).
              docker image inspect "$LOCAL" > /dev/null
            fi
            echo "${key} -> ${LOCAL}"
            locals=$(jq -c --arg k "$key" --arg l "$LOCAL" '.[$k] = $l' <<<"$locals")
          done < <(jq -r '.[] | "\(.key) \(.image) \(.compose_service)"' <<<"$IMAGES")
          printf '%s' "$locals" > "${RUNNER_TEMP}/locals.json"

      # Ce que la pile exige avant de demarrer (stack-squid engendre la CA de
      # SSL-bump que squid-explicit.conf lit au demarrage).
      - name: Preparer le terrain
        run: |
          set -euo pipefail
          setup=$("$HCI" get setup)
          if [ "$setup" = None ] || [ -z "$setup" ] || [ "$setup" = null ]; then
            echo "rien a preparer (setup)"; exit 0
          fi
          bash -c "$setup"

      # Un seul compose pour toutes les images du depot : c'est la raison
      # d'etre d'un appel unique. stack-squid eprouve squid + c-icap + clamav
      # ENSEMBLE (EICAR traverse les trois) avant qu'aucune ne soit promue.
      - name: Start stack
        id: stack
        run: |
          set -euo pipefail
          mapfile -t services < <(jq -r '.[].compose_service | select(. != null and . != "")' <<<"$IMAGES")
          if [ "${#services[@]}" -eq 0 ]; then
            echo "aucun service compose declare"; echo "up=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          profile=$("$HCI" get compose_profile)
          args=()
          case "$profile" in None|null|'') ;; *) args+=(--profile "$profile"); echo "profile=$profile" >> "$GITHUB_OUTPUT" ;; esac
          echo "up=true" >> "$GITHUB_OUTPUT"
          docker compose "${args[@]}" up -d --no-build "${services[@]}"

      # Prouve l'instruction HEALTHCHECK des images, pas seulement le binaire.
      - name: Wait for healthy
        if: steps.stack.outputs.up == 'true'
        env:
          PROFILE: ${{ steps.stack.outputs.profile }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$PROFILE" ]; then args=(--profile "$PROFILE"); fi
          rc=0
          while read -r service; do
            cid=$(docker compose "${args[@]}" ps -q "$service")
            ok=false
            for _ in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              [ "$status" = healthy ] && { ok=true; break; }
              sleep 2
            done
            if [ "$ok" = true ]; then
              echo "${service} : healthy"
            else
              echo "::error::${service} n'est pas devenu healthy"
              docker inspect --format '{{json .State.Health}}' "$cid" || true
              rc=1
            fi
          done < <(jq -r '.[].compose_service | select(. != null and . != "")' <<<"$IMAGES")
          exit $rc

      # Le tag publie doit nommer ce que l'image contient : php a publie 8.5.8
      # sous un tag 8.5.9 pendant 18 jours. Chaque sonde interroge SON image.
      - name: Assert the images are the versions we tag them with
        run: |
          set -uo pipefail
          rc=0
          while read -r key; do
            IMAGE=$(jq -r --arg k "$key" '.[$k]' "${RUNNER_TEMP}/locals.json")
            n=$("$HCI" --image "$key" get probes | jq length)
            for i in $(seq 0 $((n - 1))); do
              pr=$("$HCI" --image "$key" get probes | jq -c ".[$i]")
              label=$(jq -r .label <<<"$pr")
              want=$("$HCI" --image "$key" want "$(jq -r '.want // "version"' <<<"$pr")")
              raw=$(IMAGE="$IMAGE" bash -c "$(jq -r .cmd <<<"$pr")" 2>&1 || true)
              regex=$(jq -r '.regex // empty' <<<"$pr")
              got=$(printf '%s' "$raw" | grep -oP "$regex" | head -1 || true)
              echo "${key} ${label} declared: ${want} | image: ${got:-<illisible>}"
              if [ "$want" != "$got" ]; then
                echo "::error::${key} embarque $label ${got:-<illisible>} mais serait publiee comme ${want}"
                printf 'sortie de la sonde :\n%s\n' "$raw" | head -5
                rc=1
              fi
            done
          done < <(jq -r '.[].key' <<<"$IMAGES")
          exit $rc

      # Le manifeste dit ce qui est DANS chaque image (chemins, modes, uid/gid,
      # capabilities, doublons) : toute derive echoue ici, a regenerer dans le
      # meme commit si elle est voulue. Puis la cloture : le vrai chargeur musl,
      # dans un chroot sur le filesystem de l'image, resout chaque ELF embarque.
      - name: Image manifest, inventaire et cloture
        run: |
          set -euo pipefail
          while read -r key image manifest; do
            IMAGE=$(jq -r --arg k "$key" '.[$k]' "${RUNNER_TEMP}/locals.json")
            echo "== ${image}"
            "$SCRIPTS/image-manifest.py" --check "$IMAGE" -m "$manifest"
            "$SCRIPTS/image-manifest.py" --report -m "$manifest" --name "$image" >> "$GITHUB_STEP_SUMMARY"
            "$SCRIPTS/check-image-closure.sh" "$IMAGE"
          done < <(jq -r '.[] | "\(.key) \(.image) \(.manifest)"' <<<"$IMAGES")

      # `smoke` est au niveau du depot : un seul jeu de tests fonctionnels,
      # qui peut traverser plusieurs images. $IMAGE nomme la premiere (le cas
      # mono-image ne change pas) ; chaque image est aussi dans IMAGE_<CLE>.
      - name: Run smoke tests
        run: |
          set -euo pipefail
          smoke=$("$HCI" get smoke)
          if [ "$smoke" = None ] || [ -z "$smoke" ] || [ "$smoke" = null ]; then
            echo "pas de tests fonctionnels declares (smoke)"; exit 0
          fi
          while read -r key; do
            var="IMAGE_$(printf '%s' "$key" | tr 'a-z-' 'A-Z_')"
            export "$var=$(jq -r --arg k "$key" '.[$k]' "${RUNNER_TEMP}/locals.json")"
          done < <(jq -r '.[].key' <<<"$IMAGES")
          IMAGE=$(jq -r --arg k "$(jq -r '.[0].key' <<<"$IMAGES")" '.[$k]' "${RUNNER_TEMP}/locals.json")
          export IMAGE
          bash -c "$smoke"

      - name: Container logs (on failure)
        if: failure() && steps.stack.outputs.up == 'true'
        env:
          PROFILE: ${{ steps.stack.outputs.profile }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$PROFILE" ]; then args=(--profile "$PROFILE"); fi
          docker compose "${args[@]}" logs

      - name: Teardown
        if: always() && steps.stack.outputs.up == 'true'
        env:
          PROFILE: ${{ steps.stack.outputs.profile }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$PROFILE" ]; then args=(--profile "$PROFILE"); fi
          docker compose "${args[@]}" down -v

  # -------------------------------------------------------------------
  #  arm64 sur runner NATIF (ubuntu-24.04-arm, gratuit en public) : sous QEMU
  #  un rebuild complet prenait 27 min (php) a 1 h 40 (bind9).
  # -------------------------------------------------------------------
  build-arm64:
    name: Build arm64 ${{ matrix.image.key }}
    needs: [config, lint, lint-image]
    if: needs.config.outputs.arm64 == 'true' && needs.config.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.config.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image.image }}
      KEY: ${{ matrix.image.key }}
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      - name: Build-args depuis versions.json
        id: build-args
        uses: ./.hardened-ci/versions
        with:
          path: ${{ inputs.workdir }}
      - uses: docker/setup-buildx-action@v4
      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.path }}
          file: ${{ matrix.image.file }}
          build-args: ${{ steps.build-args.outputs.build-args }}
          platforms: linux/arm64
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-arm64
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-arm64
          no-cache-filters: prep

      - name: Upload digest arm64
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build arm64 n'a pas rendu de digest pour ${KEY}"; exit 1; }
          printf '%s' "$DIGEST" > "${RUNNER_TEMP}/digest-arm64-${KEY}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-arm64-${{ env.KEY }}
          path: ${{ runner.temp }}/digest-arm64-${{ env.KEY }}.txt
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  PR : chaque architecture construite sur son runner natif, sans pousser.
  # -------------------------------------------------------------------
  validate:
    name: Validate build (PR, ${{ matrix.image.key }}, ${{ matrix.platform }})
    needs: [config, lint, lint-image]
    if: needs.config.outputs.validate == 'true' && needs.config.outputs.publish != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.config.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      - name: Build-args depuis versions.json
        id: build-args
        uses: ./.hardened-ci/versions
        with:
          path: ${{ inputs.workdir }}
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.path }}
          file: ${{ matrix.image.file }}
          build-args: ${{ steps.build-args.outputs.build-args }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.image }}-validate-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image }}-validate-${{ matrix.platform }}

  # -------------------------------------------------------------------
  #  Un tag <version>.<revision> est immuable : le routeur l'epingle. Deja
  #  present -> pas de promotion, run vert. Toute autre reponse du registre
  #  que 200/404 fait echouer : ne jamais reecrire par defaut.
  # -------------------------------------------------------------------
  revision:
    name: Immutable tag guard
    needs: config
    if: needs.config.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      # Carte {cle: {tag, version, published}} : un job en matrice ne peut pas
      # rendre une sortie par element, et `promote` a besoin des trois.
      images: ${{ steps.revision.outputs.images }}
      # Au moins une image a une revision neuve (sinon rien a promouvoir).
      any: ${{ steps.revision.outputs.any }}
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      # fetch-depth 0 : le compteur compte des commits ; build-revision.sh
      # refuse de lui-meme un clone superficiel.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      # Un tour de boucle par image : chacune a son compteur, donc son tag.
      # Un commit sur squid/ ne doit pas faire monter la revision de clamav.
      - name: Compute build revisions
        id: revision
        env:
          HCI: ${{ github.workspace }}/.hardened-ci/scripts/hci-config.py
          IMAGES: ${{ needs.config.outputs.images }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out='{}'
          any=false
          while read -r key image; do
            TAG=$("$HCI" --image "$key" tag)
            VERSION=$("$HCI" --image "$key" version)
            REPO="${NAMESPACE}/${image}"
            # Jeton AUTHENTIFIE : en anonyme, le registre repond 403 (et non 404)
            # pour un paquet qui n'existe pas encore -- toute premiere publication
            # d'un depot echouait ici (vu sur l'image temoin, 2026-10-04).
            TOKEN=$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" "https://${REGISTRY}/token?scope=repository:${REPO}:pull" | jq -r .token)
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
            case "$CODE" in
              200) PUBLISHED=true
                   echo "- \`${image}:${TAG}\` est deja publie : pas de promotion (aucun input de cette image n'a change)" >> "$GITHUB_STEP_SUMMARY" ;;
              404) PUBLISHED=false; any=true
                   echo "- \`${image}:${TAG}\` : nouvelle revision, promotion" >> "$GITHUB_STEP_SUMMARY" ;;
              *)   echo "::error::${REGISTRY} a repondu ${CODE} pour ${REPO}:${TAG}"; exit 1 ;;
            esac
            out=$(jq -c --arg k "$key" --arg t "$TAG" --arg v "$VERSION" --argjson p "$PUBLISHED" \
                    '.[$k] = {tag: $t, version: $v, published: $p}' <<<"$out")
          done < <(jq -r '.[] | "\(.key) \(.image)"' <<<"$IMAGES")
          echo "images=${out}" >> "$GITHUB_OUTPUT"
          echo "any=${any}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.image.key }}
    needs: [config, build, test, build-arm64, revision]
    # `test` eprouve les images ENSEMBLE : aucune n'est promue si le test
    # commun echoue. C'est tout l'interet d'un seul appel pour N images.
    if: >-
      always() && needs.config.outputs.publish == 'true'
      && needs.build.result == 'success' && needs.test.result == 'success'
      && needs.revision.result == 'success' && needs.revision.outputs.any == 'true'
      && (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.config.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image.image }}
      KEY: ${{ matrix.image.key }}
      VERSION: ${{ fromJSON(needs.revision.outputs.images)[matrix.image.key].version }}
      TAG: ${{ fromJSON(needs.revision.outputs.images)[matrix.image.key].tag }}
    steps:
      # Le contexte `matrix` n'existe pas dans le `if:` d'un job : la garde
      # d'immuabilite de CETTE image se joue donc ici, et toutes les etapes
      # suivantes s'y accrochent. Un tag deja publie n'est jamais repromu.
      - name: Garde d'immuabilite de cette image
        id: guard
        env:
          PUBLISHED: ${{ fromJSON(needs.revision.outputs.images)[matrix.image.key].published }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE_NAME}:${TAG} est deja publie : rien a promouvoir."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.guard.outputs.skip == 'false'
      - name: Login ghcr.io
        if: steps.guard.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker Hub credentials
        if: steps.guard.outputs.skip == 'false'
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "image=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login Docker Hub
        if: steps.dockerhub.outputs.available == 'true' && steps.guard.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        if: steps.guard.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.image }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=semver,pattern={{version}}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Digests construits pour cette image
        if: steps.guard.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: digest*-${{ env.KEY }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create tags on the tested digests (no rebuild)
        id: manifest
        if: steps.guard.outputs.skip == 'false'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          AMD64=$(cat "${DIGESTS}/digest-${KEY}.txt")
          ARM64=$(cat "${DIGESTS}/digest-arm64-${KEY}.txt" 2>/dev/null || true)
          [ -n "$AMD64" ] || { echo "::error::aucun digest amd64 pour ${KEY}"; exit 1; }
          IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}"
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          srcs=("${IMAGE}@${AMD64}")
          [ -n "$ARM64" ] && srcs+=("${IMAGE}@${ARM64}")
          docker buildx imagetools create "${args[@]}" "${srcs[@]}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        if: steps.guard.outputs.skip == 'false'
      - name: Sign image (OIDC keyless)
        if: steps.guard.outputs.skip == 'false'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          HUB: ${{ steps.dockerhub.outputs.image }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
          if [ "$HAS_DOCKERHUB" = true ]; then
            COSIGN_REPOSITORY="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}" cosign sign --yes "${HUB}@${DIGEST}"
          fi
      - name: Download prep SBOM
        if: steps.guard.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: sbom-prep-${{ env.KEY }}
      - name: hardened-ci a la ref de ce workflow
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      # Le binaire Go init est copie de gobuilder dans le stage final, le plus
      # souvent sans passer par prep : la SBOM prep ne le voyait pas et
      # cve-watch etait aveugle aux CVE de la stdlib Go (2026-10-09). Les
      # binaires Go de l'image publiee y sont ajoutes, et rien d'autre.
      - name: SBOM of the published image (Go binaries)
        if: steps.guard.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: cyclonedx
          output: sbom-final.cdx.json
      - name: Add Go binaries to the prep SBOM
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          .hardened-ci/scripts/sbom-add-gobinaries.sh sbom-prep.cdx.json sbom-final.cdx.json > sbom.cdx.json
          echo "SBOM : $(jq '.components | length' sbom-prep.cdx.json) composants prep -> $(jq '.components | length' sbom.cdx.json) avec les binaires Go"
      # La SBOM du stage prep (+ binaires Go), attestee sur chaque digest publie :
      # seule base d'un audit CVE d'une image FROM scratch (cve-watch la relit
      # chaque jour).
      - name: Attest prep SBOM (CycloneDX)
        if: steps.guard.outputs.skip == 'false'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
      - name: Trivy scan
        if: steps.guard.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload SARIF
        if: always() && steps.guard.outputs.skip == 'false'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: ${{ env.IMAGE_NAME }}
      - name: GitHub SLSA Attestation
        if: steps.guard.outputs.skip == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: steps.guard.outputs.skip == 'false'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE_NAME} ${TAG}"
            echo "**Digest:** \`${DIGEST}\`"
            echo '```'
            echo "docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG}"
            echo "cosign verify ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${TAG} \\"
            echo "  --certificate-identity-regexp '^https://github.com/(${GITHUB_REPOSITORY}|jbsky/hardened-ci)/' \\"
            echo "  --certificate-github-workflow-repository ${GITHUB_REPOSITORY} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  update-readme:
    name: Refresh README tag block
    needs: [config, promote, revision]
    # Pas pour un depot temoin (workdir != .) : son README n'a pas de bloc de tags.
    if: always() && needs.promote.result == 'success' && inputs.workdir == '.' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      # Le script prend autant de specs que d'images : le bloc de tags du
      # README est rendu d'un coup, N lignes pour N images.
      - name: Rewrite tag block
        env:
          IMAGES: ${{ needs.config.outputs.images }}
          REVS: ${{ needs.revision.outputs.images }}
        run: |
          set -euo pipefail
          mapfile -t specs < <(jq -r --argjson r "$REVS" \
            '.[] | "jbsky/\(.image)=\($r[.key].version)=\($r[.key].tag)"' <<<"$IMAGES")
          "$GITHUB_WORKSPACE/.hardened-ci/scripts/update-readme-tags.sh" "${specs[@]}"
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then echo "README already names the current tag"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): tag immuable courant [skip ci]"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
          done
          exit 1

  # -------------------------------------------------------------------
  #  Garde les 6 derniers tags immuables (+ :latest) ; scripts prune-* de
  #  hardened-ci a la ref de ce workflow.
  # -------------------------------------------------------------------
  cleanup:
    name: Prune old registry tags
    needs: [config, promote]
    # always() : sans lui, un ancetre saute (build-arm64 sur une image amd64
    # seule) fait sauter ce job aussi, en vert -- vu sur l'image temoin.
    if: always() && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGES: ${{ needs.config.outputs.images }}
      KEEP: '6'
    steps:
      - name: hardened-ci a la ref de ce workflow
        uses: actions/checkout@v7
        with:
          repository: jbsky/hardened-ci
          ref: ${{ job.workflow_sha }}
          path: .hardened-ci
      - name: Prune old Docker Hub tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "pas d'identifiants Docker Hub : saute"; exit 0; fi
          while read -r image; do
            ./.hardened-ci/scripts/prune-registry-tags.sh "$DOCKERHUB_USERNAME" "$image" "$KEEP"
          done < <(jq -r '.[].image' <<<"$IMAGES")
      - name: Prune old GHCR tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r image; do
            ./.hardened-ci/scripts/prune-ghcr-tags.sh "${{ github.repository_owner }}" "$image" "$KEEP"
          done < <(jq -r '.[].image' <<<"$IMAGES")

  # -------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [config, revision, promote]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.revision.result == 'success'
      && (needs.promote.result == 'success' || needs.revision.outputs.any == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_NAME: ${{ needs.config.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Archive + checksums (fichiers suivis seulement)
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"; N="${IMAGE_NAME}-${V}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${N}/" -o "dist/${N}.tar.gz" HEAD
          cd dist
          sha256sum "${N}.tar.gz" > "${N}.sha256"
          sha512sum "${N}.tar.gz" > "${N}.sha512"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/${{ env.IMAGE_NAME }}-${{ github.ref_name }}.tar.gz
            dist/${{ env.IMAGE_NAME }}-${{ github.ref_name }}.sha256
            dist/${{ env.IMAGE_NAME }}-${{ github.ref_name }}.sha512

  # -------------------------------------------------------------------
  notify:
    name: Issue si echec
    needs: [config, lint, lint-image, build, test, build-arm64, revision, promote, update-readme, cleanup, release]
    if: always() && needs.config.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const rouges = Object.entries(needs)
              .filter(([, j]) => j.result === 'failure' || j.result === 'cancelled')
              .map(([nom]) => nom);
            const branche = context.ref.replace(/^refs\/(heads|tags)\//, '');
            const titre = `[CI] build-push en echec sur ${branche}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure', per_page: 100 });
            const issue = ouvertes.find(i => i.title === titre);
            if (rouges.length) {
              const corps = `Run \`${context.eventName}\` sur ${context.sha.slice(0, 7)} en echec `
                + `(${rouges.join(', ')}) : ${run}\n\ncc @${context.repo.owner}`;
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: corps });
              } else {
                await github.rest.issues.create({ ...context.repo, title: titre, body: corps,
                  labels: ['ci-failure', 'automated'] });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Repasse au vert : ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
