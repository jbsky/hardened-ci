# =====================================================================
#  Test -- ce depot fait autorite pour sept pipelines : chaque brique est
#  eprouvee ici, dans les deux sens (elle passe sur un depot conforme, elle
#  ECHOUE sur un depot fautif), avant qu'un appelant ne bumpe son SHA.
# =====================================================================
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Tests unitaires des scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  versions-action:
    name: Action versions (conforme / fautif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Depot conforme -- doit passer
        id: ok
        uses: ./versions
        with:
          path: tests/fixtures/conforme

      - name: Build-args produits
        env:
          ARGS: ${{ steps.ok.outputs.build-args }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ARGS"
          expected=$(printf 'APP_VERSION=1.2.3\nAPP_SHA256=%s' "$(printf 'f%.0s' $(seq 64))")
          [ "$ARGS" = "$expected" ] || { echo "::error::build-args inattendus"; exit 1; }

      # Le meme depot, avec UNE version recopiee en dur dans le Dockerfile.
      - name: Injecter une version par defaut
        run: |
          cp -r tests/fixtures/conforme /tmp/fautif
          sed -i 's/^ARG APP_VERSION$/ARG APP_VERSION=1.2.3/' /tmp/fautif/Dockerfile
          grep -q '^ARG APP_VERSION=1.2.3$' /tmp/fautif/Dockerfile

      - name: Depot fautif -- doit echouer
        id: ko
        continue-on-error: true
        uses: ./versions
        with:
          path: /tmp/fautif

      - name: Le controle a bien echoue
        if: steps.ko.outcome != 'failure'
        run: |
          echo "::error::l'action a laisse passer ARG APP_VERSION=1.2.3"
          exit 1

  # Le gabarit doit passer le controle tel qu'il est livre : une PR qui le
  # ferait deriver (version en dur, cle morte, build non branche) echoue ici,
  # avant qu'un nouveau depot en herite.
  template:
    name: Gabarit d'image (instancie et eprouve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instancier le gabarit
        run: ./scripts/new-image.sh _img

      - name: Controle et test unitaire sur le gabarit instancie
        working-directory: _img
        run: make check

      - name: Le workflow du gabarit est valide (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color _img/.github/workflows/build-push.yml _img/.github/workflows/cve-watch.yml

      - name: Le controle attrape une version recopiee en dur
        working-directory: _img
        run: |
          sed -i 's/^ARG APP_VERSION$/ARG APP_VERSION=1.0.0/' Dockerfile
          grep -q '^ARG APP_VERSION=1.0.0$' Dockerfile
          if ./scripts/versions-build-args.py --check; then
            echo "::error::--check a laisse passer ARG APP_VERSION=1.0.0 dans le gabarit"
            exit 1
          fi
          git checkout -- Dockerfile 2>/dev/null || sed -i 's/^ARG APP_VERSION=1.0.0$/ARG APP_VERSION/' Dockerfile

      - uses: docker/setup-buildx-action@v4

      - name: Un build sans build-arg echoue au garde
        working-directory: _img
        run: |
          if docker buildx build --no-cache . 2> build.log; then
            echo "::error::le gabarit construit sans APP_VERSION"
            exit 1
          fi
          grep -q 'build-args requis depuis versions.json' build.log

      - name: La version de versions.json arrive jusqu'a l'image
        working-directory: _img
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx build $(./scripts/versions-build-args.py --docker) --output type=local,dest=out .
          want=$(jq -r .app versions.json)
          got=$(cat out/VERSION)
          echo "versions.json: ${want} | image: ${got}"
          [ "$want" = "$got" ]

  # La logique des issues `cve` est rejouee sur le script EXTRAIT du workflow
  # livre (pas une copie) contre un faux client GitHub : creation, liste
  # inchangee = rien, liste changee, fermeture, « audit impossible » unique,
  # selftest. Le cas « liste changee » a trouve un vrai bug (marqueur tronque).
  cve-watch-issues:
    name: cve-watch -- logique des issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extraire le script du workflow livre
        run: |
          python3 - <<'PY'
          import yaml
          w = yaml.safe_load(open('.github/workflows/cve-watch.yml'))
          steps = [s for s in w['jobs']['watch']['steps'] if s.get('name') == 'Issue cve']
          assert len(steps) == 1, "etape 'Issue cve' introuvable"
          open('/tmp/cve-watch.js', 'w').write(steps[0]['with']['script'])
          PY

      - name: Rejouer les cas
        env:
          SCRIPT_FILE: /tmp/cve-watch.js
        run: node tests/cve-watch/issue.test.js

  # La detection, dans les deux sens, sur deux SBOM figees : alpine:3.24@28bd
  # (libcrypto3/libssl3 3.5.7, vulnerable pour toujours) DOIT sortir
  # CVE-2026-14456 ; la meme SBOM reduite a un paquet fictif ne doit RIEN
  # sortir. Pas de SBOM reelle « propre aujourd'hui » : elle rougirait le
  # jour ou une CVE tombe dessus, sans aucun commit.
  cve-watch-scan:
    name: cve-watch -- detection (vulnerable / propre)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SBOM vulnerable
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: tests/fixtures/sbom/vulnerable.cdx.json
          format: json
          output: vulnerable.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: SBOM propre
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: tests/fixtures/sbom/clean.cdx.json
          format: json
          output: clean.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: La vulnerable remonte, la propre non
        run: |
          set -euo pipefail
          n_vuln=$(jq '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2026-14456")] | length' vulnerable.json)
          n_clean=$(jq '[.Results[]?.Vulnerabilities[]?] | length' clean.json)
          echo "vulnerable: ${n_vuln} x CVE-2026-14456 | propre: ${n_clean}"
          [ "$n_vuln" -ge 1 ] || { echo "::error::la SBOM vulnerable n'a pas remonte CVE-2026-14456"; exit 1; }
          [ "$n_clean" -eq 0 ] || { echo "::error::la SBOM propre a remonte ${n_clean} CVE"; exit 1; }

  # Les six scripts partages (etape 2) : chacun eprouve dans les deux sens.
  # build-revision sur un historique git connu (les trois formes d'appel des
  # depots + clone superficiel refuse) ; cloture et manifeste sur des images
  # temoins minuscules (complete / trouee, identique / un fichier de plus).
  scripts:
    name: Scripts partages (revision, cloture, manifeste, tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/scripts/*.sh

      - name: build-revision -- comptes attendus sur un historique connu
        run: ./tests/scripts/build-revision.sh

      - name: hci-config -- conforme / COPY hors compteur / paths / sonde
        run: ./tests/scripts/hci-config.sh

      - name: check-image-closure et image-manifest -- dans les deux sens
        run: ./tests/scripts/image-checks.sh

      - name: Action tools
        id: hci
        uses: ./tools

      - name: tools donne le repertoire des scripts de cette ref
        env:
          DIR: ${{ steps.hci.outputs.dir }}
        run: |
          set -euo pipefail
          test "$DIR" = "$(cd scripts && pwd)"
          # Sans argument, le script sort en erreur avec son usage : on veut
          # l'usage, pas le code de sortie (pipefail ferait echouer le tube).
          out=$("$DIR/build-revision.sh" 2>&1 || true)
          grep -q usage <<<"$out"

  # Le gabarit build-push complet, en mode PR, sur le depot temoin template/ :
  # lint, build amd64 + prep scanne, tests sur l'image (sondes de version,
  # manifeste, inventaire, cloture). Rien n'est pousse.
  gabarit-build-push:
    name: Gabarit build-push (template, mode PR)
    uses: ./.github/workflows/build-push.yml
    with:
      workdir: template
      publish: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write

